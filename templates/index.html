<!-- ==================================================
HOME PAGE

Purpose:
Serves as the main entry point of RecipeWise. 
- Allows user to search for recipes by entering a recipe name.
- Retrieves marching recipes from TheMealDB API
- Displays recipe names, images, and country of origin 
- Each recipe name is a link to the Recipe Details page. 
================================================== -->

<!DOCTYPE html>

<html>
<head>
    <title>RecipeWise</title>
    <link rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}">
</head>

<!-- Top Navigation Bar--> 
<body> 
    <nav>
        <div class="nav-container">
            <a href="/" class="nav-logo-link">
                <img
                    src="{{ url_for('static', filename='logo.svg') }}"
                    alt="RecipeWise"
                    class="nav-logo">
            </a>
            <a href="/favorites" class="nav-link">
               <svg class="nav-icon" viewBox="0 -960 960 960">
                    <path d="m480-120-58-52q-101-91-167-157T150-447.5Q111-500 95.5-544T80-634q0-94 63-157t157-63q52 0 99 22t81 62q34-40 81-62t99-22q94 0 157 63t63 157q0 46-15.5 90T810-447.5Q771-395 705-329T538-172l-58 52Z"/>
                </svg>
                Favorites
            </a>
        </div>
    </nav>

<!-- Page Content -->  
    <main class="page-container">
        <div class="hero {% if recipe_count > 0 %}hero-results{% endif %}"> <!-- AI Assistance -->
            {% if not meals %}
                <img
                    src="{{ url_for('static', filename='logo.svg') }}"
                    alt="RecipeWise Logo"
                    class="logo"> 
            {% endif %}
            <form class="search-form" method= "POST">
                <input 
                class="search-input"
                type="text"
                name="recipe_name" 
                placeholder="Search for a recipe">
                
                <button class="btn-primary" type="submit"> 
                    <img 
                    src = "{{ url_for ('static', filename='search.svg')}}"
                    alt=" "
                    class="button-icon">
                    Search
                </button>
            </form>
        </div>
    
        <div class = "results-selection"> 
            {% if recipe_count > 0 %}
                <p class = "results-count">
                    {{ recipe_count }} matching recipes found containing "{{ recipe_name }}".
                </p>
            {% endif%}
            <div class="recipe-grid"> 
                    {% for meal in meals %}
                        <!-- ==================================================
                            Add note AI assistance  
                        ================================================== -->
                        <div class="recipe-card">
                            <a href="/recipe/{{meal['idMeal']}}" class="card-link"></a>

                            <div class="recipe-image-container">
                                <img src="{{meal["strMealThumb"]}}" alt="{{meal["strMeal"]}}" width="200">
                                
                                <form action="/favorites/add/{{ meal ['idMeal'] }}" method = "POST">
                                    <button class="favorite-btn" type="submit" > 
                                        {% if meal ['idMeal'] in favorites_ids %}
                                            <img 
                                                src = "{{ url_for ('static', filename='heart-full-red.svg')}}"
                                                alt=" Favorited">
                                        {% else %}
                                            <svg
                                                    xmlns="http://www.w3.org/2000/svg"
                                                    height="32px"
                                                    viewBox="0 -960 960 960"
                                                    width="32px"
                                                    fill="currentColor">
                                                    <path d="m480-120-58-52q-101-91-167-157T150-447.5Q111-500 95.5-544T80-634q0-94 63-157t157-63q52 0 99 22t81 62q34-40 81-62t99-22q94 0 157 63t63 157q0 46-15.5 90T810-447.5Q771-395 705-329T538-172l-58 52Zm0-108q96-86 158-147.5t98-107q36-45.5 50-81t14-70.5q0-60-40-100t-100-40q-47 0-87 26.5T518-680h-76q-15-41-55-67.5T300-774q-60 0-100 40t-40 100q0 35 14 70.5t50 81q36 45.5 98 107T480-228Zm0-273Z"/>
                                            </svg>
                                        {% endif %}
                                    </button>
                                </form>
                            </div>

                            <div class="recipe-content">
                                <h2 class="recipe-title">
                                    {{meal["strMeal"]}}
                                </h2>

                                <p class="recipe-country">
                                    <b> {{meal["strArea"]}} </b>
                                </p>
                            </div>
                        </div>
                    {% endfor %}    
                </div>
        </div>
    </main> 
</body>
</html>
